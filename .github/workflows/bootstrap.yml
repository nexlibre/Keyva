name: Import HeliBoard
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/bootstrap.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import audited upstream snapshot with history
        run: |
          git config user.name "nexlibre"
          git config user.email "134002775+nexlibre@users.noreply.github.com"
          git remote add upstream https://github.com/HeliBorg/HeliBoard.git
          git fetch --no-tags upstream main
          git merge --no-commit --no-ff --allow-unrelated-histories upstream/main
          git rm -f .github/workflows/build-debug-apk.yml .github/workflows/build-test-auto.yml
          git commit -m "Import HeliBoard source and history; retain GPL and credits"
          git push origin HEAD:main
