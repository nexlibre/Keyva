name: Publish verified Keyva beta
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require recorded real-service acceptance and passing CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          evidence=json.load(open('docs/RELEASE_VERIFICATION.json'))
          accepted=evidence['source_commit']
          assert re.fullmatch(r'[0-9a-f]{40}',accepted), 'Acceptance must identify a tested source commit'
          changed=subprocess.check_output(['git','diff','--name-only',accepted,'HEAD'],text=True).splitlines()
          assert all(p.startswith('docs/') or p in ('README.md','CHANGELOG.md') for p in changed), 'Application, tooling or workflow source changed since acceptance'
          assert evidence['real_microphone'] is True, 'Real microphone/ASR acceptance is still pending'
          assert evidence['real_gemini'] is True, 'Real Gemini acceptance with a fresh key is still pending'
          assert evidence['traditional_keyboard'] is True, 'Traditional keyboard regression acceptance is still pending'
          query=f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/keyva-ci.yml/runs?head_sha={accepted}&status=success"
          runs=json.loads(subprocess.check_output(['gh','api',query]))
          assert runs['total_count']>0, 'No successful CI run for this exact commit'
          PY
      - name: Require permanent signing credentials
        env:
          STORE: ${{ secrets.KEYVA_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.KEYVA_STORE_PASSWORD }}
          ALIAS: ${{ secrets.KEYVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYVA_KEY_PASSWORD }}
        run: |
          test -n "$STORE" && test -n "$PASSWORD" && test -n "$ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Permanent release signing credentials are not configured'; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108'
      - run: ./gradlew assembleRelease --stacktrace
      - name: Sign and verify release candidate
        env:
          STORE: ${{ secrets.KEYVA_KEYSTORE_BASE64 }}
          KEYVA_STORE_PASSWORD: ${{ secrets.KEYVA_STORE_PASSWORD }}
          KEYVA_KEY_ALIAS: ${{ secrets.KEYVA_KEY_ALIAS }}
          KEYVA_KEY_PASSWORD: ${{ secrets.KEYVA_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$STORE" | base64 --decode > "$RUNNER_TEMP/keyva-release.jks"
          trap 'rm -f "$RUNNER_TEMP/keyva-release.jks"' EXIT
          APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          mkdir -p publication
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/keyva-release.jks" --ks-key-alias "$KEYVA_KEY_ALIAS" --ks-pass env:KEYVA_STORE_PASSWORD --key-pass env:KEYVA_KEY_PASSWORD --out publication/Keyva-1.0.0-beta.1.apk "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs publication/Keyva-1.0.0-beta.1.apk > publication/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging publication/Keyva-1.0.0-beta.1.apk > publication/identity.txt
          grep "package: name='org.nexlibre.keyva'" publication/identity.txt
          ! grep -q application-debuggable publication/identity.txt
          sha256sum publication/*.apk > publication/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Keyva-signed-release-candidate
          path: publication
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify installation of signed release on Android 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          disable-animations: true
          script: python3 tools/keyva_release_install.py publication/Keyva-1.0.0-beta.1.apk
      - name: Publish prerelease with APK and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0-beta.1 publication/* --target "$GITHUB_SHA" --prerelease --title 'Keyva Beta 1.0.0' --notes-file docs/RELEASE_NOTES.md
